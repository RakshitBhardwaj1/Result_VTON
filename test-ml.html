<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Recommendation Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .controls {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .control-group {
            margin: 10px 0;
        }
        label {
            font-weight: bold;
            display: inline-block;
            width: 100px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: white;
        }
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
            margin: 2px;
        }
        .badge-category { background: #e3f2fd; color: #1976d2; }
        .badge-size { background: #f3e5f5; color: #7b1fa2; }
        .badge-color { background: #e8f5e9; color: #388e3c; }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🤖 ML Recommendation System Test</h1>
    
    <div class="controls">
        <h3>Test Parameters</h3>
        <div class="control-group">
            <label>Category:</label>
            <select id="category">
                <option value="">All</option>
                <option value="tops" selected>Tops</option>
                <option value="pants">Pants</option>
                <option value="bottoms">Bottoms</option>
                <option value="dresses">Dresses</option>
                <option value="jackets">Jackets</option>
            </select>
        </div>
        <div class="control-group">
            <label>Size:</label>
            <select id="size">
                <option value="">All</option>
                <option value="S">Small</option>
                <option value="M" selected>Medium</option>
                <option value="L">Large</option>
                <option value="XL">Extra Large</option>
            </select>
        </div>
        <div class="control-group">
            <label>Colors:</label>
            <input type="text" id="colors" placeholder="e.g., blue,red,black">
            <small>(comma-separated)</small>
        </div>
        <button onclick="testRecommendations()">🔍 Get Recommendations</button>
    </div>

    <div id="status"></div>
    <div id="results" class="results"></div>

    <script>
        const API_URL = 'http://localhost:5000/api/products/recommendations';

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }

        async function testRecommendations() {
            const category = document.getElementById('category').value;
            const size = document.getElementById('size').value;
            const colors = document.getElementById('colors').value;

            // Build query string
            const params = new URLSearchParams();
            if (category) params.append('category', category);
            if (size) params.append('size', size);
            if (colors) params.append('colors', colors);

            const url = `${API_URL}?${params.toString()}`;
            console.log('Calling API:', url);

            showStatus('🔄 Loading recommendations...', 'info');

            try {
                const response = await fetch(url);
                const data = await response.json();

                console.log('API Response:', data);

                if (data.success) {
                    showStatus(`✅ Found ${data.count} recommendations (filters: ${JSON.stringify(data.filters)})`, 'success');
                    displayProducts(data.products);
                } else {
                    showStatus(`❌ Error: ${data.message}`, 'error');
                }
            } catch (error) {
                console.error('API Error:', error);
                showStatus(`❌ Failed to fetch: ${error.message}`, 'error');
            }
        }

        function displayProducts(products) {
            const resultsDiv = document.getElementById('results');
            
            if (!products || products.length === 0) {
                resultsDiv.innerHTML = '<p>No products found</p>';
                return;
            }

            resultsDiv.innerHTML = products.map(product => `
                <div class="product-card">
                    ${product.image ? 
                        `<img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.style.display='none'">` : 
                        '<div class="product-image" style="background:#f0f0f0; display:flex; align-items:center; justify-content:center;">📦 No Image</div>'
                    }
                    <h4>${product.name}</h4>
                    <p>${product.description || 'No description'}</p>
                    <div>
                        ${product.category ? `<span class="badge badge-category">${product.category}</span>` : ''}
                        ${product.size ? `<span class="badge badge-size">${product.size}</span>` : ''}
                        ${product.color ? `<span class="badge badge-color">${product.color}</span>` : ''}
                    </div>
                    <p style="margin-top:10px; font-weight:bold;">
                        ${product.price ? (typeof product.price === 'number' ? '$' + product.price.toFixed(2) : product.price) : 'Price not set'}
                    </p>
                </div>
            `).join('');
        }

        // Load initial recommendations on page load
        window.addEventListener('DOMContentLoaded', () => {
            testRecommendations();
        });
    </script>
</body>
</html>
